services:
  - type: web
    name: sonora
    runtime: python
    plan: free            # free instances sleep when idle; use starter for always-on
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --workers 1 --threads 8 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SONORA_PASSWORD     # required: protects the whole site and your account
        sync: false
      - key: YTM_BROWSER_JSON    # optional: contents of browser.json (signed-in account)
        sync: false
      - key: YTDLP_COOKIES       # optional: path of a secret file, e.g. /etc/secrets/cookies.txt
        sync: false
