<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sonora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
<style>
/* Layout concept: YT Music structure (rail, search, shelves, bottom bar, full-screen player) built from
   Material 3 Expressive parts: big shape radii that morph on hover/press, spring easing, wavy progress,
   and a tonal scheme generated from the cover art of the current track. */
:root{
  --font:'Roboto Flex',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1);
  --emph:cubic-bezier(.2,0,0,1);
  --bar-h:108px;
  /* light scheme (overwritten at runtime by the cover palette) */
  --p:#4558a9;--on-p:#fff;--pc:#dce1ff;--on-pc:#00164f;
  --s:#5a5d72;--sc:#dee1f9;--on-sc:#171b2c;
  --t:#75546f;--tc:#ffd7f5;--on-tc:#2c122a;
  --bg:#fbf8ff;--s1:#f5f2fa;--s2:#efedf4;--s3:#e9e7ef;--s4:#e3e1e9;
  --fg:#1b1b21;--fg2:#45464f;--ol:#767680;--olv:#c6c6d0;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --p:#b7c4ff;--on-p:#132878;--pc:#2d4090;--on-pc:#dce1ff;
  --s:#c2c5dd;--sc:#424659;--on-sc:#dee1f9;
  --t:#e3bada;--tc:#5c3c56;--on-tc:#ffd7f5;
  --bg:#121318;--s1:#1b1b21;--s2:#1f1f25;--s3:#292a2f;--s4:#34343a;
  --fg:#e4e1e9;--fg2:#c6c6d0;--ol:#90909a;--olv:#45464f;color-scheme:dark}}
:root[data-theme="dark"]{
  --p:#b7c4ff;--on-p:#132878;--pc:#2d4090;--on-pc:#dce1ff;
  --s:#c2c5dd;--sc:#424659;--on-sc:#dee1f9;
  --t:#e3bada;--tc:#5c3c56;--on-tc:#ffd7f5;
  --bg:#121318;--s1:#1b1b21;--s2:#1f1f25;--s3:#292a2f;--s4:#34343a;
  --fg:#e4e1e9;--fg2:#c6c6d0;--ol:#90909a;--olv:#45464f;color-scheme:dark}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:400 14px/1.45 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
input,select{font:inherit;color:inherit}
svg.ic{fill:currentColor;flex:none;display:block}
:focus-visible{outline:3px solid var(--p);outline-offset:2px}
[hidden]{display:none!important}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- shell ---------- */
#app{height:100%;display:grid;grid-template-columns:96px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"top top" "rail main" "bar bar"}
.top{grid-area:top;display:flex;align-items:center;gap:20px;padding:14px 20px 10px 20px}
.brand{display:flex;align-items:center;gap:10px;font:850 22px/1 var(--font);font-stretch:125%;letter-spacing:-.02em;width:76px;flex:none}
.brand span{display:none}
.search{flex:1;max-width:640px;margin:0 auto;display:flex;align-items:center;gap:8px;height:52px;padding:0 8px 0 18px;border-radius:26px;background:var(--s3);color:var(--fg2);transition:border-radius .35s var(--spring),background .2s}
.search:focus-within{border-radius:16px;background:var(--s4)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:16px;color:var(--fg)}
.search input::-webkit-search-cancel-button{display:none}
.top-r{display:flex;align-items:center;gap:6px;margin-left:auto}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--fg2);transition:background .2s,border-radius .3s var(--spring),transform .2s var(--spring),color .2s;flex:none}
.ib:hover{background:color-mix(in srgb,var(--fg) 10%,transparent);color:var(--fg)}
.ib:active{border-radius:14px;transform:scale(.92)}
.ib.sm{width:36px;height:36px}
.ib.on{color:var(--p)}
.statusbtn{display:flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:14px;background:var(--sc);color:var(--on-sc);font-weight:600;white-space:nowrap}
.spinner{width:16px;height:16px;border-radius:5px;background:currentColor;animation:morph 1.4s var(--emph) infinite}
@keyframes morph{0%{transform:rotate(0);border-radius:50%}50%{transform:rotate(180deg);border-radius:30%}100%{transform:rotate(360deg);border-radius:50%}}

.rail{grid-area:rail;display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:12px}
.nav{display:flex;flex-direction:column;align-items:center;gap:4px;width:80px;font:600 12px/1.2 var(--font);color:var(--fg2)}
.nav .pill{width:56px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background .25s,width .35s var(--spring),border-radius .35s var(--spring)}
.nav:hover .pill{background:color-mix(in srgb,var(--fg) 9%,transparent)}
.nav.on{color:var(--fg)}
.nav.on .pill{background:var(--sc);color:var(--on-sc);width:64px}

main{grid-area:main;overflow:auto;margin:0 12px 12px 0;border-radius:32px;background:var(--s1);scrollbar-width:thin;scrollbar-color:var(--olv) transparent;outline:0}
.pad{padding:8px clamp(14px,2.6vw,36px) 36px}
.view-t{padding:28px clamp(14px,2.6vw,36px) 8px}
h1.page{font:850 clamp(34px,5.4vw,60px)/1 var(--font);font-stretch:125%;letter-spacing:-.025em;text-wrap:balance}
.eyebrow{font:700 12px/1 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--p)}
.sub{color:var(--fg2);margin-top:8px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:14px clamp(14px,2.6vw,36px) 4px;scrollbar-width:none}
.chip{height:38px;padding:0 18px;border-radius:12px;background:var(--s3);font-weight:600;white-space:nowrap;transition:border-radius .3s var(--spring),background .2s}
.chip:hover{border-radius:19px}
.chip.on{background:var(--p);color:var(--on-p)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:48px;padding:0 26px 0 20px;border-radius:24px;font-weight:700;font-size:15px;transition:border-radius .35s var(--spring),transform .2s var(--spring),background .2s}
.btn:hover{border-radius:16px}
.btn:active{border-radius:10px;transform:scale(.96)}
.btn.pri{background:var(--p);color:var(--on-p)}
.btn.ton{background:var(--sc);color:var(--on-sc)}
.btn.lg{height:60px;padding:0 32px 0 26px;font-size:17px;border-radius:30px}
.btn.txt{padding:0 14px;height:40px;color:var(--p)}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;align-items:center}

/* ---------- shelves & cards ---------- */
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:28px clamp(14px,2.6vw,36px) 12px}
.sh h2{font:800 clamp(22px,2.6vw,30px)/1.1 var(--font);font-stretch:112%;letter-spacing:-.01em}
.sh .eyebrow{display:block;margin-bottom:6px}
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(144px,15vw,190px);gap:18px;overflow-x:auto;padding:4px clamp(14px,2.6vw,36px) 14px;scrollbar-width:none;scroll-snap-type:x proximity}
.shelf>*{scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(144px,15vw,190px),1fr));gap:22px 18px;padding:8px clamp(14px,2.6vw,36px) 36px}
.card{display:block;min-width:0;text-align:left}
.cv-wrap{position:relative;aspect-ratio:1;border-radius:28px;overflow:hidden;background:var(--s3);transition:border-radius .45s var(--spring),transform .3s var(--spring)}
.card:hover .cv-wrap{border-radius:44px}
.card:active .cv-wrap{transform:scale(.97)}
.card.round .cv-wrap{border-radius:50%}
.card.round:hover .cv-wrap{border-radius:38%}
.card.dash .cv-wrap{background:none;border:2px dashed var(--ol);display:grid;place-items:center;color:var(--fg2)}
.fab{position:absolute;right:10px;bottom:10px;width:48px;height:48px;border-radius:50%;background:var(--p);color:var(--on-p);display:grid;place-items:center;opacity:0;transform:translateY(10px) scale(.8);transition:opacity .2s,transform .35s var(--spring),border-radius .3s var(--spring)}
.fab:hover{border-radius:16px}
.card:hover .fab,.card:focus-within .fab{opacity:1;transform:none}
.c-t{margin-top:10px;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-s{color:var(--fg2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card.round .c-t,.card.round .c-s{text-align:center}
.cv{width:100%;height:100%;object-fit:cover;display:block}
.ph{display:grid;place-items:center;background:var(--pc);color:var(--on-pc)}
.ph svg{width:42%;height:42%;opacity:.8}

.quick{display:grid;grid-template-rows:repeat(4,auto);grid-auto-flow:column;grid-auto-columns:min(100%,440px);gap:2px 20px;overflow-x:auto;padding:0 clamp(14px,2.6vw,36px) 8px;scrollbar-width:none;scroll-snap-type:x proximity}
.quick .row{scroll-snap-align:start}

/* ---------- track rows ---------- */
.list{display:grid;gap:2px}
.row{display:grid;grid-template-columns:56px minmax(0,1fr) minmax(0,.8fr) 52px 92px;gap:16px;align-items:center;padding:6px 10px;border-radius:20px;content-visibility:auto;contain-intrinsic-size:auto 68px;cursor:default;transition:background .15s,border-radius .35s var(--spring)}
.row:hover{background:var(--s3);border-radius:30px}
.row.cur{background:var(--pc);color:var(--on-pc)}
.row.cur .r-sub,.row.cur .r-album,.row.cur .r-time{color:inherit;opacity:.8}
.r-lead{position:relative;width:56px;height:56px;border-radius:16px;overflow:hidden;display:grid;place-items:center;background:var(--s4)}
.r-num{font-weight:700;color:var(--fg2);font-variant-numeric:tabular-nums}
.row.cur .r-num{display:none}
.r-play{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.5);color:#fff;opacity:0;transition:opacity .15s}
.row:hover .r-play{opacity:1}
.eq{position:absolute;inset:0;display:none;align-items:flex-end;justify-content:center;gap:3px;padding:16px 0;background:rgba(0,0,0,.45)}
.eq i{width:4px;height:100%;background:#fff;border-radius:2px;transform-origin:bottom;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.4s}.eq i:nth-child(3){animation-delay:-.75s}
@keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
body.is-playing .row.cur .eq{display:flex}
body.is-playing .row.cur:hover .eq{display:none}
.row.cur .r-num{display:none}
.r-title{font-weight:650;font-size:15px}
.r-sub,.r-album{color:var(--fg2);font-size:13px}
.r-time{color:var(--fg2);font-variant-numeric:tabular-nums;text-align:right}
.r-act{display:flex;justify-content:flex-end;gap:0}
.r-act .like{opacity:0}
.row:hover .r-act .like,.row .r-act .like[aria-pressed="true"]{opacity:1}
.like[aria-pressed="true"]{color:var(--p)}
.r-main{min-width:0}.r-main>div,.r-album{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- detail header ---------- */
.hd{display:flex;gap:clamp(18px,3vw,36px);align-items:flex-end;padding:44px clamp(14px,2.6vw,36px) 26px;background:linear-gradient(180deg,color-mix(in srgb,var(--hdr,var(--p)) 42%,var(--s1)) 0%,var(--s1) 100%)}
.hd .art{width:clamp(150px,22vw,250px);aspect-ratio:1;border-radius:48px;overflow:hidden;flex:none;box-shadow:0 24px 50px -22px rgba(0,0,0,.55);background:var(--s3)}
.hd.artist .art{border-radius:50%}
.hd-t{min-width:0}
.hd h1{font:850 clamp(30px,5vw,64px)/1.02 var(--font);font-stretch:122%;letter-spacing:-.025em;text-wrap:balance;margin:10px 0}
.meta{color:var(--fg2)}.meta a:hover{text-decoration:underline}

/* ---------- hero (empty) ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:24px;align-items:center;padding:clamp(24px,5vw,72px) clamp(14px,3.4vw,56px);min-height:100%}
.hero h1{font:850 clamp(40px,6.4vw,88px)/.96 var(--font);font-stretch:128%;letter-spacing:-.035em;margin:16px 0;text-wrap:balance}
.hero p{max-width:52ch;color:var(--fg2);font-size:16px}
.hero p.fine{font-size:13px;margin-top:18px}
.hero-art{width:100%;max-width:460px;justify-self:center}
.hero-art .s1{fill:var(--p)}.hero-art .s2{fill:var(--tc)}.hero-art .s3{fill:var(--sc)}.hero-art .s4{fill:var(--pc)}.hero-art .s5{fill:var(--t)}.hero-art .n{fill:var(--on-p)}
.spin{transform-origin:210px 200px;animation:spin 48s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.prog{height:10px;border-radius:5px;background:var(--s4);overflow:hidden;margin-top:24px;max-width:420px}
.prog i{display:block;height:100%;background:var(--p);border-radius:5px;transition:width .2s}

/* ---------- bottom bar ---------- */
.bar{grid-area:bar;position:relative;margin:0 12px 12px;padding:12px 18px;border-radius:32px;background:var(--s3);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:center;overflow:hidden;z-index:40;min-height:84px}
.bar-line{display:none}
.b-left{display:flex;align-items:center;gap:14px;min-width:0;cursor:pointer;text-align:left}
.b-cv{width:60px;height:60px;border-radius:18px;overflow:hidden;flex:none;background:var(--s4);transition:border-radius .4s var(--spring)}
body.is-playing .b-cv{border-radius:30px}
.b-info{min-width:0}
.b-title{font-weight:700;font-size:15px}
.b-sub{color:var(--fg2);font-size:13px}
.b-mid{display:grid;gap:2px;justify-items:center;min-width:0}
.b-ctrl{display:flex;align-items:center;gap:8px}
.b-seek{display:flex;align-items:center;gap:12px;width:100%;max-width:560px;font-size:12px;color:var(--fg2);font-variant-numeric:tabular-nums}
.b-seek span{width:38px;text-align:center}
.wave{position:relative;flex:1;height:26px;cursor:pointer;touch-action:none;min-width:0}
.wave canvas{width:100%;height:100%;display:block}
.b-right{display:flex;align-items:center;justify-content:flex-end;gap:2px}
.vol{display:flex;align-items:center;gap:2px}
.vol input{width:96px;accent-color:var(--p)}
.b-mini{display:none}
.tbtn{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:var(--sc);color:var(--on-sc);transition:border-radius .35s var(--spring),transform .2s var(--spring)}
.tbtn:hover{border-radius:24px}
.tbtn:active{border-radius:12px;transform:scale(.92)}
.playbtn{width:64px;height:64px;border-radius:50%;background:var(--p);color:var(--on-p);display:grid;place-items:center;transition:border-radius .4s var(--spring),transform .2s var(--spring)}
body.is-playing .playbtn{border-radius:22px}
.playbtn:hover{filter:brightness(1.06)}
.playbtn:active{border-radius:14px;transform:scale(.93)}
.pp .i-pause{display:none}
body.is-playing .pp .i-pause{display:block}
body.is-playing .pp .i-play{display:none}
.mode.on{color:var(--p);position:relative}
.mode.on::after{content:"";position:absolute;bottom:5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor}

/* ---------- now playing ---------- */
.np{position:fixed;inset:0 0 var(--bar-h) 0;z-index:30;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden;visibility:hidden;transform:translateY(8%);opacity:0;transition:transform .5s var(--emph),opacity .3s,visibility 0s .5s;
  background:radial-gradient(120% 90% at 15% 0%,color-mix(in srgb,var(--pc) 85%,transparent),transparent 62%),radial-gradient(90% 80% at 100% 100%,color-mix(in srgb,var(--tc) 55%,transparent),transparent 62%),var(--bg)}
.np.open{visibility:visible;transform:none;opacity:1;transition:transform .5s var(--emph),opacity .3s}
.np-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 6px}
.np-tabs{display:none}
.np-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,5vw,72px);padding:8px clamp(20px,5vw,72px) 28px;min-height:0}
.np-player{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:22px;min-height:0;min-width:0}
.np-art{width:min(100%,calc(100vh - 360px));min-width:220px;aspect-ratio:1;background:var(--s3);border-radius:14%;overflow:hidden;box-shadow:0 30px 70px -30px rgba(0,0,0,.6);transition:border-radius .6s var(--spring)}
body.is-playing .np-art{border-radius:9%}
.np-art.swap{animation:pop .55s var(--spring)}
@keyframes pop{from{transform:scale(.88) rotate(-3deg);opacity:.2}to{transform:none;opacity:1}}
.np-meta{display:flex;align-items:center;gap:12px;width:min(100%,calc(100vh - 360px));min-width:220px}
.np-titles{flex:1;min-width:0}
.np-titles h2{font:800 clamp(24px,3vw,36px)/1.1 var(--font);font-stretch:115%;letter-spacing:-.015em}
.np-artist{display:block;color:var(--fg2);font-size:16px;margin-top:4px}
.np-artist:hover{text-decoration:underline}
.np-ctrls{display:none;width:100%;flex-direction:column;gap:12px}
.np-ctrls .b-seek{max-width:none}
.np-ctrls .row1{display:flex;align-items:center;justify-content:center;gap:10px}
.np-ctrls .playbtn{width:84px;height:72px;border-radius:50%}
body.is-playing .np-ctrls .playbtn{border-radius:26px}
.np-side{display:flex;flex-direction:column;min-height:0;min-width:0}
.seg{display:inline-flex;align-self:flex-start;gap:2px;background:var(--s3);padding:4px;border-radius:22px;margin-bottom:12px}
.seg button{height:38px;padding:0 20px;border-radius:18px;font-weight:650;transition:background .2s,border-radius .3s var(--spring)}
.seg button.on{background:var(--p);color:var(--on-p)}
.side-pane{flex:1;overflow:auto;min-height:0;scrollbar-width:thin;scrollbar-color:var(--olv) transparent;border-radius:24px}
.np[data-side="queue"] #pane-lyrics,.np[data-side="lyrics"] #pane-queue{display:none}
.q-ctx{color:var(--fg2);font-size:13px;padding:4px 10px 10px}
.qrow{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:14px;align-items:center;padding:6px 8px;border-radius:18px;transition:background .15s,border-radius .3s var(--spring)}
.qrow:hover{background:color-mix(in srgb,var(--fg) 9%,transparent);border-radius:28px}
.qrow.cur{background:var(--pc);color:var(--on-pc)}
.qrow.dragover{box-shadow:0 -3px 0 var(--p)}
.qrow .cvb{width:48px;height:48px;border-radius:14px;overflow:hidden;background:var(--s4)}
.qrow .qt{font-weight:650}.qrow .qs{font-size:13px;color:var(--fg2)}
.qrow.cur .qs{color:inherit;opacity:.8}
.qrow .qm{min-width:0}.qrow .qm>div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ly{font:800 clamp(22px,2.4vw,34px)/1.22 var(--font);font-stretch:112%;letter-spacing:-.01em;padding:9px 6px;opacity:.32;cursor:pointer;transform-origin:left center;transition:opacity .35s,transform .45s var(--spring)}
.ly.past{opacity:.55}
.ly.on{opacity:1;transform:scale(1.035);color:var(--p)}
.ly-plain{white-space:pre-wrap;font:500 17px/1.7 var(--font);padding:6px}
.empty{color:var(--fg2);padding:28px 10px;font-size:16px}

/* ---------- menus, dialogs, toast ---------- */
.menu{position:fixed;z-index:80;min-width:220px;max-width:min(320px,calc(100vw - 24px));padding:8px;border-radius:24px;background:var(--s4);box-shadow:0 12px 40px -8px rgba(0,0,0,.5);animation:pop .3s var(--spring)}
.menu button{display:flex;align-items:center;gap:14px;width:100%;height:44px;padding:0 14px;border-radius:14px;text-align:left;font-weight:550}
.menu button:hover{background:color-mix(in srgb,var(--fg) 10%,transparent);border-radius:22px}
.menu hr{border:0;height:1px;background:var(--olv);margin:6px 8px}
.toast{position:fixed;left:50%;bottom:calc(var(--bar-h) + 12px);transform:translate(-50%,20px);z-index:90;padding:14px 22px;border-radius:18px;background:var(--fg);color:var(--bg);font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .4s var(--spring);max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
dialog{border:0;border-radius:36px;background:var(--s3);color:var(--fg);padding:28px;width:min(580px,calc(100vw - 24px));max-height:calc(100vh - 32px);overflow:auto;margin:auto}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog h3{font:800 26px/1.1 var(--font);font-stretch:115%;margin-bottom:18px}
.fld{display:grid;gap:6px;margin-bottom:12px}
.fld label,.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg2)}
.fld input[type=text],.fld input[type=number],.fld select{height:50px;border-radius:14px;border:0;background:var(--s4);padding:0 16px;outline:2px solid transparent;min-width:0;width:100%}
.fld input:focus,.fld select:focus{outline-color:var(--p)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.dlg-acts{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;flex-wrap:wrap}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--olv)}
.setrow:last-of-type{border-bottom:0}
.setrow b{display:block;font-weight:650}.setrow small{color:var(--fg2)}
.sw{width:52px;height:32px;border-radius:16px;background:var(--s4);border:2px solid var(--ol);position:relative;flex:none;transition:background .25s,border-color .25s}
.sw::after{content:"";position:absolute;top:6px;left:6px;width:16px;height:16px;border-radius:50%;background:var(--ol);transition:transform .35s var(--spring),width .2s,height .2s,background .2s,top .2s}
.sw[aria-checked="true"]{background:var(--p);border-color:var(--p)}
.sw[aria-checked="true"]::after{background:var(--on-p);width:24px;height:24px;top:2px;transform:translateX(20px)}
.cand{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;width:100%;padding:6px;border-radius:16px;text-align:left}
.cand:hover{background:var(--s4)}
.cand img{width:48px;height:48px;border-radius:10px;object-fit:cover;background:var(--s4)}
.edit-top{display:flex;gap:16px;align-items:center;margin-bottom:16px}
.edit-top .art{width:92px;height:92px;border-radius:26px;overflow:hidden;flex:none;background:var(--s4)}

/* ---------- bottom nav (phones) ---------- */
.bnav{display:none}

@media (max-width:899px){
  :root{--bar-h:0px}
  #app{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "main" "bar"}
  .rail{display:none}
  .top{padding:12px 14px 8px;flex-wrap:wrap;gap:10px}
  .brand{width:auto}
  .brand span{display:inline}
  .top-r{min-width:0}
  .statusbtn{height:36px;padding:0 12px;font-size:13px}
  .search{order:3;flex:1 1 100%;max-width:none;height:48px;min-width:0}
  main{margin:0 8px;border-radius:28px 28px 0 0;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;padding:8px 6px calc(10px + env(safe-area-inset-bottom,0px));background:var(--s2)}
  .bnav .nav{width:auto}
  .bar{position:fixed;left:8px;right:8px;bottom:calc(76px + env(safe-area-inset-bottom,0px));margin:0;z-index:55;grid-template-columns:minmax(0,1fr) auto;padding:8px 10px;min-height:0;border-radius:26px;background:var(--pc);color:var(--on-pc)}
  .bar .b-sub{color:inherit;opacity:.8}
  .b-mid,.b-right{display:none}
  .b-cv{width:52px;height:52px}
  .b-mini{display:flex;align-items:center;gap:4px}
  .b-mini .ib{color:inherit}
  .b-mini .playbtn{width:52px;height:52px}
  .bar-line{display:block;position:absolute;left:0;right:0;bottom:0;height:3px;background:color-mix(in srgb,var(--on-pc) 18%,transparent)}
  .bar-line i{display:block;height:100%;width:0;background:var(--on-pc)}
  .np{inset:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .np-tabs{display:flex;gap:2px;padding:4px;background:var(--s3);border-radius:20px}
  .np-tabs button{height:36px;padding:0 14px;border-radius:16px;font-weight:650;font-size:13px}
  .np-tabs button.on{background:var(--p);color:var(--on-p)}
  .np-body{grid-template-columns:minmax(0,1fr);padding:4px 20px 20px;gap:0}
  .np[data-m="player"] .np-side{display:none}
  .np:not([data-m="player"]) .np-player{display:none}
  .np .seg{display:none}
  .np-art{width:min(100%,calc(100vh - 430px));min-width:200px}
  .np-meta{width:100%;min-width:0}
  .np-ctrls{display:flex}
  .toast{bottom:150px}
  .hero{grid-template-columns:1fr}
  .hero-art{max-width:300px;order:-1}
  .row{grid-template-columns:52px minmax(0,1fr) 44px;gap:12px}
  .r-album,.r-time,.r-act .like{display:none}
  .r-lead{width:52px;height:52px}
  .hd{flex-direction:column;align-items:flex-start;padding-top:28px}
  .vol input{display:none}
  .quick{grid-auto-columns:88%}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

  setMany:(s,pairs)=>run(s,'readwrite',o=>{pairs.forEach(([k,v])=>o.put(v,k))}).catch(()=>{}),clear:s=>run(s,'readwrite',o=>o.clear()).catch(()=>{}),
  all:async s=>{try{const d=await open();return await new Promise((res,rej)=>{const out=[],c=d.transaction(s).objectStore(s).openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out.push([cur.key,cur.value]);cur.continue()}else res(out)};c.onerror=()=>rej(c.error)})}catch{return[]}}}})();

/* ---------- covers ---------- */
function cov(key,cls=''){const th=key&&S.thumbs.get(key);return th?`<img class="cv ${cls}" src="${esc(th.url)}" alt="" loading="lazy" decoding="async">`:`<div class="cv ph ${cls}">${ic('note')}</div>`}
async function processCover(blobIn){
  const bmp=await createImageBitmap(blobIn);const sq=size=>{const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');const s=Math.min(bmp.width,bmp.height);x.drawImage(bmp,(bmp.width-s)/2,(bmp.height-s)/2,s,s,0,0,size,size);return c};
  const toB=(c,q)=>new Promise(r=>c.toBlob(r,'image/jpeg',q));const big=Math.min(900,Math.min(bmp.width,bmp.height));
  const[thumb,full]=await Promise.all([toB(sq(300),.82),toB(sq(big),.88)]);const seed=extractSeed(sq(48).getContext('2d').getImageData(0,0,48,48).data);bmp.close?.();return{thumb,full,seed}}
function saveCover(key,b,force){
  if(!force&&S.coverJobs.has(key))return S.coverJobs.get(key);
  const p=(async()=>{try{const{thumb,full,seed}=await processCover(b);const old=S.thumbs.get(key);if(old&&!old.remote)URL.revokeObjectURL(old.url);S.big.delete(key);
    await DB.set('covers',key,full);await DB.set('thumbs',key,{thumb,seed});S.thumbs.set(key,{url:URL.createObjectURL(thumb),seed});return true}catch(e){console.warn('cover',e);return false}})();
  S.coverJobs.set(key,p);return p}
async function fetchCover(key,url,remoteFallback=true){
  try{const r=await fetch(url);if(!r.ok)throw 0;const b=await r.blob();if(await saveCover(key,b,true))return true;throw 0}
  catch{if(remoteFallback){S.thumbs.set(key,{url,seed:null,remote:true});await DB.set('thumbs',key,{remote:url});return true}return false}}
async function bigCover(key){if(!key)return null;if(S.big.has(key))return S.big.get(key);const b=await DB.get('covers',key);if(b){const u=URL.createObjectURL(b);S.big.set(key,u);return u}return S.thumbs.get(key)?.url||null}

/* ---------- reading the library ---------- */
const akey=(artist,album)=>norm(artist||'Unknown artist')+'|'+norm(album||'Singles');
async function* walk(dir,prefix=[]){for await(const[name,h]of dir.entries()){if(h.kind==='directory'){if(!name.startsWith('.'))yield*walk(h,[...prefix,name])}else if(AUDIO.test(name)&&!name.startsWith('.'))yield{path:[...prefix,name],handle:h}}}
function readTags(file,path,id){
  return new Promise(res=>{
    const t={id,path,name:path[path.length-1],size:file.size||0,mtime:file.lastModified||0,title:'',artist:'',albumArtist:'',album:'',year:'',genre:'',no:0,disc:0,dur:0,cover:'',lyrics:'',meta:{g:{}},added:Date.now()};
    const done=async tags=>{
      try{const g=k=>{const v=tags&&tags[k];return typeof v==='string'?v.trim():''};
        t.title=g('title');t.artist=g('artist');t.album=g('album');t.year=(g('year').match(/\d{4}/)||[''])[0];t.genre=g('genre').replace(/^\(\d+\)/,'').trim();t.no=parseInt(g('track'))||0;
        const fr=k=>{const v=tags&&tags[k];return v&&typeof v.data==='string'?v.data.trim():''};
        t.albumArtist=fr('TPE2')||fr('aART')||g('band');t.disc=parseInt(fr('TPOS')||fr('disk'))||0;
        const ly=tags&&tags.lyrics;t.lyrics=(ly&&ly.lyrics)||(typeof ly==='string'?ly:'');
        const stem=t.name.replace(/\.[^.]+$/,'').replace(/_/g,' '),gs=t.meta.g;
        if(!t.title){let ti=stem.replace(/^\s*\d{1,3}\s*[-._)]\s*/,'');if(!t.artist){const p=ti.split(/\s+-\s+/);if(p.length>=2){t.artist=p[0].trim();ti=p.slice(1).join(' - ').trim();gs.artist=1}}t.title=ti;gs.title=1}
        if(!t.no){const n=stem.match(/^\s*(\d{1,3})\s*[-._)]/);if(n)t.no=+n[1]}
        if(!t.album&&path.length>=2){t.album=path[path.length-2];gs.album=1}
        if(!t.artist&&path.length>=3){t.artist=path[path.length-3];gs.artist=1}
        const pic=tags&&tags.picture;if(pic&&pic.data&&pic.data.length){const ck=t.album&&!gs.album?akey(t.albumArtist||t.artist,t.album):id;t.cover=ck;
          if(!S.thumbs.has(ck))await saveCover(ck,new Blob([new Uint8Array(pic.data)],{type:pic.format||'image/jpeg'}))}
      }catch(e){console.warn('tags',e)}
      res(t)};
    if(!window.jsmediatags){done(null);return}
    const to=setTimeout(()=>done(null),10000);
    const go=(s,retry)=>{try{jsmediatags.read(s,{onSuccess:r=>{clearTimeout(to);done(r.tags)},onError:async()=>{
      if(retry&&typeof file==='string'){try{go(await(await fetch(file)).blob(),false);return}catch{}}clearTimeout(to);done(null)}})}catch{clearTimeout(to);done(null)}};
    go(file,true)})}
async function scan(src){
  if(S.scan)return;const entries=[];S.scan={done:0,total:0,found:0};status();
  try{
    if(src.handle){for await(const e of walk(src.handle)){entries.push(e);S.scan.total=entries.length;if(entries.length%50===0)renderProgress()}}
    else src.files.forEach(f=>{const p=(f.webkitRelativePath||f.name).split('/');if(p.length>1)p.shift();if(AUDIO.test(f.name))entries.push({path:p,file:f})});
    S.scan.total=entries.length;if(!entries.length){S.scan=null;status();toast('No audio files found in that folder.');route();return}
    const seen=new Set(),fresh=[];let i=0;
    await Promise.all(Array.from({length:6},async()=>{while(i<entries.length){const e=entries[i++];
      try{const file=e.file||await e.handle.getFile(),id=e.path.join('/');seen.add(id);S.files.set(id,file);const old=S.tracks.get(id);
        if(!(old&&old.size===file.size&&old.mtime===file.lastModified)){const t=await readTags(file,e.path,id);if(old){t.dur=old.dur;t.added=old.added}S.tracks.set(id,t);fresh.push(t)}}catch(err){console.warn(err)}
      S.scan.done++;renderProgress()}}));
    const gone=[...S.tracks.keys()].filter(id=>!seen.has(id)&&!id.startsWith('bundled/'));gone.forEach(id=>{S.tracks.delete(id);DB.del('tracks',id)});
    await DB.setMany('tracks',fresh.map(t=>[t.id,t]));
    navigator.storage?.persist?.();
  }catch(e){console.warn(e);toast('Could not read the folder.')}
  S.scan=null;rebuild();status();route();probeDurations();startEnrich()}
let renderProgress=throttle(()=>{status();const p=$('#scanprog');if(p&&S.scan){p.style.width=(S.scan.total?S.scan.done/S.scan.total*100:5)+'%';$('#scantxt').textContent=S.scan.total?`Reading ${S.scan.done} of ${S.scan.total} files`:'Looking for audio files…'}},150);
function probe(file){return new Promise((res,rej)=>{const a=new Audio(),u=typeof file==='string'?file:URL.createObjectURL(file);const end=(v,e)=>{clearTimeout(to);if(typeof file!=='string')URL.revokeObjectURL(u);a.removeAttribute('src');e?rej():res(v)};const to=setTimeout(()=>end(0,1),8000);
  a.preload='metadata';a.onloadedmetadata=()=>end(isFinite(a.duration)?a.duration:0);a.onerror=()=>end(0,1);a.src=u})}
async function probeDurations(){const todo=[...S.tracks.values()].filter(t=>!t.dur);if(!todo.length)return;let i=0;
  await Promise.all([0,1,2].map(async()=>{while(i<todo.length){const t=todo[i++];try{const f=t.url||S.files.get(t.id)||await getFile(t,{silent:true});if(f)t.dur=await probe(f)}catch{}}}));
  await DB.setMany('tracks',todo.filter(t=>t.dur).map(t=>[t.id,t]));rebuild();if(!S.scan&&['songs','album','artist','playlist','liked'].includes(S.route.name))route(true)}
async function getFile(t,opt={}){
  let f=S.files.get(t.id);if(f)return f;
  if(S.root){try{if((await S.root.queryPermission({mode:'read'}))!=='granted'){if(opt.silent)return null;if((await S.root.requestPermission({mode:'read'}))!=='granted'){S.needPerm=true;status();return null}}
    S.needPerm=false;status();let d=S.root;for(const s of t.path.slice(0,-1))d=await d.getDirectoryHandle(s);f=await(await d.getFileHandle(t.path[t.path.length-1])).getFile();S.files.set(t.id,f);return f}catch(e){console.warn(e)}}
  return null}

/* ---------- included songs: the "songs" folder next to index.html ---------- */
const BUNDLED_DIR='songs';
const bUrl=p=>BUNDLED_DIR+'/'+p.split('/').map(encodeURIComponent).join('/');
const bundledNote=()=>({ok:`${S.bundled.n} songs from the “${BUNDLED_DIR}” folder`,none:`No songs found in the “${BUNDLED_DIR}” folder`,off:'Off',file:'Needs a local web server. Run python3 -m http.server in this folder and open localhost:8000.',idle:'Checking…'}[S.bundled.state]||'');
async function listBundled(){
  try{const r=await fetch(BUNDLED_DIR+'/songs.json',{cache:'no-cache'});
    if(r.ok){const j=await r.json(),arr=Array.isArray(j)?j:(j.tracks||j.songs||[]);
      const m=arr.map(x=>typeof x==='string'?{file:x}:x).filter(x=>x&&typeof x.file==='string'&&AUDIO.test(x.file)).map(x=>({...x,file:x.file.replace(/^\.?\//,'')}));if(m.length)return m}}
  catch(e){if(e instanceof TypeError)throw e}
  const out=[];
  const crawl=async(dir,depth)=>{const r=await fetch(BUNDLED_DIR+'/'+dir);if(!r.ok)throw new Error('no listing');
    const doc=new DOMParser().parseFromString(await r.text(),'text/html');
    for(const a of doc.querySelectorAll('a[href]')){const h=a.getAttribute('href');if(!h||/^([?#\/.]|[a-z][a-z0-9+.-]*:)/i.test(h))continue;
      let d;try{d=decodeURIComponent(h)}catch{continue}
      if(d.endsWith('/')){if(depth<4)await crawl(dir+d,depth+1)}else if(AUDIO.test(d))out.push({file:dir+d})}};
  await crawl('',0);return out}
function removeBundled(ids){
  ids.forEach(id=>{S.tracks.delete(id);DB.del('tracks',id)});
  if(S.cur&&S.cur.id.startsWith('bundled/')){A.pause();A.removeAttribute('src');S.cur=null;S.qi=-1}
  S.queue=S.queue.filter(id=>S.tracks.has(id));S.orig=S.orig.filter(id=>S.tracks.has(id));rebuild()}
async function loadBundled(){
  const had=[...S.tracks.keys()].filter(id=>id.startsWith('bundled/'));
  if(S.cfg.bundled===false){S.bundled={state:'off',n:0};if(had.length)removeBundled(had);return false}
  let list;try{list=await listBundled()}catch{S.bundled={state:location.protocol==='file:'?'file':'none',n:had.length};return false}
  if(!list.length){S.bundled={state:'none',n:0};if(had.length)removeBundled(had);return false}
  const seen=new Set(),fresh=[];let i=0;
  await Promise.all(Array.from({length:4},async()=>{while(i<list.length){
    const e=list[i++],path=e.file,id='bundled/'+path;seen.add(id);const sig=JSON.stringify(e),old=S.tracks.get(id);
    if(old&&(old.meta.msig===sig||old.meta.edited)){old.meta.msig=sig;continue}
    try{const t=await readTags(bUrl(path),path.split('/'),id);t.url=bUrl(path);t.meta.msig=sig;
      for(const k of['title','artist','album','albumArtist','year','genre'])if(e[k]){t[k]=String(e[k]);delete t.meta.g[k]}
      for(const k of['no','disc'])if(+e[k])t[k]=+e[k];
      if(e.cover){const key='bundled:'+id;if(await fetchCover(key,bUrl(String(e.cover).replace(/^\.?\//,'')),false))t.cover=key}
      if(old){t.dur=old.dur;t.added=old.added;if(old.meta.web)t.meta.web=old.meta.web}
      S.tracks.set(id,t);fresh.push(t)}catch(err){console.warn('bundled',path,err)}}}));
  const gone=had.filter(id=>!seen.has(id));if(gone.length)removeBundled(gone);
  await DB.setMany('tracks',fresh.map(t=>[t.id,t]));S.bundled={state:'ok',n:list.length};rebuild();return true}

/* ---------- indexes ---------- */
function rebuild(){
  S.albums=new Map();S.artists=new Map();
  for(const t of S.tracks.values()){
    const aa=t.albumArtist||t.artist||'Unknown artist';t.aa=aa;t.ak=akey(aa,t.album);t.q=norm(t.title+' '+t.artist+' '+t.album+' '+aa);
    let al=S.albums.get(t.ak);if(!al)S.albums.set(t.ak,al={key:t.ak,name:t.album||'Singles',artist:aa,year:'',tracks:[],cover:'',dur:0});al.tracks.push(t);
    const add=(name)=>{const k=norm(name)||'unknown';let ar=S.artists.get(k);if(!ar)S.artists.set(k,ar={key:k,name,tracks:[],albums:new Set(),cover:''});if(!ar.tracks.includes(t))ar.tracks.push(t);ar.albums.add(t.ak)};
    add(aa);if(t.artist&&norm(t.artist)!==norm(aa))add(t.artist)}
  for(const al of S.albums.values()){al.tracks.sort((a,b)=>(a.disc||1)-(b.disc||1)||(a.no||999)-(b.no||999)||a.title.localeCompare(b.title));
    al.cover=(al.tracks.find(t=>S.thumbs.has(t.cover))||{}).cover||'';al.dur=al.tracks.reduce((s,t)=>s+(t.dur||0),0);al.year=al.tracks.map(t=>t.year).filter(Boolean).sort()[0]||''}
  for(const ar of S.artists.values()){const first=[...ar.albums].map(k=>S.albums.get(k)).find(a=>a&&a.cover);ar.cover=first?first.cover:''}}
const albumList=()=>[...S.albums.values()];
const artistList=()=>[...S.artists.values()].sort((a,b)=>a.name.localeCompare(b.name));
const tt=t=>t.title||t.name;

/* ---------- theme + palette ---------- */
const TOKENS=['--p','--on-p','--pc','--on-pc','--s','--sc','--on-sc','--t','--tc','--on-tc','--bg','--s1','--s2','--s3','--s4','--fg','--fg2','--ol','--olv'];
(function registerProps(){const st=document.createElement('style');st.textContent=TOKENS.map(t=>`@property ${t}{syntax:'<color>';inherits:true;initial-value:#888}`).join('')+`:root{transition:${TOKENS.map(t=>t+' .9s ease').join(',')}}`;document.head.appendChild(st)})();
const isDark=()=>{const d=document.documentElement.dataset.theme;return d?d==='dark':matchMedia('(prefers-color-scheme: dark)').matches};
function applyPalette(seed){S.seed=seed||DEFAULT_SEED;const sc=makeScheme(S.seed,isDark()),st=document.documentElement.style;for(const k in sc)st.setProperty(k,sc[k])}
function setPalette(t){applyPalette(t?(S.thumbs.get(t.cover)?.seed||hashSeed(t.ak||t.id)):S.seed)}
function applyTheme(){const r=document.documentElement;if(S.cfg.theme==='system')delete r.dataset.theme;else r.dataset.theme=S.cfg.theme;applyPalette(S.seed)}

/* ---------- toast + status ---------- */
let toastT;function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),3400)}
function status(){const el=$('#status');if(!el)return;let txt='',act='';
  if(S.scan){txt=S.scan.total?`Reading ${S.scan.done}/${S.scan.total}`:'Scanning…'}
  else if(S.enrich.running){txt=`Fetching info ${S.enrich.done}/${S.enrich.total}`;act='enrich'}

/* ---------- queue + playback ---------- */
let seq=0,objUrl='';
function playList(ids,start=0,o={}){
  ids=ids.filter(id=>S.tracks.has(id));if(!ids.length)return;S.orig=ids.slice();const sh=o.shuffle===undefined?S.shuffle:o.shuffle;S.shuffle=sh;
  if(sh){const first=ids[start];S.queue=[first,...shuffle(ids.filter((_,i)=>i!==start))];S.qi=0}else{S.queue=ids.slice();S.qi=start}
  S.ctx=o.ctx||'';load(S.qi,true)}
async function load(i,play=true){
  const t=S.tracks.get(S.queue[i]);if(!t)return;S.qi=i;S.cur=t;S.counted=false;S.lyrLines=null;S.lyrIdx=-1;const my=++seq;
  updateNP(true);setPalette(t);saveSession();
  const f=t.url?null:await getFile(t);if(my!==seq)return;
  if(!f&&!t.url){toast('Can’t open that file. Reconnect your folder and try again.');A.removeAttribute('src');syncPlay();return}
  if(objUrl)URL.revokeObjectURL(objUrl);objUrl='';if(t.url)A.src=t.url;else{objUrl=URL.createObjectURL(f);A.src=objUrl}
  if(play){try{await A.play()}catch(e){if(e.name!=='AbortError')console.warn(e)}}
  mediaSession(t);getLyrics(t).then(()=>{if(S.cur===t)renderLyrics()});kick()}
function togglePlay(){if(!S.cur){if(S.tracks.size)playList([...S.tracks.values()].sort(sorter.title).map(t=>t.id),0,{shuffle:true});return}
  if(!A.getAttribute('src'))return load(S.qi,true);A.paused?A.play().catch(()=>{}):A.pause()}
function next(auto){if(!S.queue.length)return;
  if(auto&&S.repeat===2){A.currentTime=0;A.play().catch(()=>{});return}
  let i=S.qi+1;if(i>=S.queue.length){if(S.repeat===1)i=0;else{if(auto){A.pause();A.currentTime=0;syncPlay();return}return}}load(i,true)}
function prev(){if(!S.queue.length)return;if(A.currentTime>3){A.currentTime=0;return}let i=S.qi-1;if(i<0){if(S.repeat===1)i=S.queue.length-1;else{A.currentTime=0;return}}load(i,true)}
function enqueue(ids,nextUp){ids=ids.filter(id=>S.tracks.has(id));if(!ids.length)return;
  if(!S.queue.length){playList(ids,0,{shuffle:false});return}
  const at=nextUp?S.qi+1:S.queue.length;S.queue.splice(at,0,...ids);
  const oi=nextUp?S.orig.indexOf(S.cur.id)+1:S.orig.length;S.orig.splice(oi<0?S.orig.length:oi,0,...ids);
  toast(nextUp?'Will play next':'Added to queue');renderQueue()}
function toggleShuffle(){S.shuffle=!S.shuffle;
  if(S.queue.length){if(S.shuffle){S.queue=[...S.queue.slice(0,S.qi+1),...shuffle(S.queue.slice(S.qi+1))]}else{const id=S.cur&&S.cur.id;const keep=new Set(S.queue);S.orig=S.orig.filter(x=>keep.has(x));S.queue=S.orig.slice();S.qi=Math.max(0,S.queue.indexOf(id))}}
  syncModes();renderQueue();saveSession()}
function cycleRepeat(){S.repeat=(S.repeat+1)%3;syncModes();saveSession();toast(['Repeat off','Repeat all','Repeat one'][S.repeat])}
let sessT;function saveSession(){clearTimeout(sessT);sessT=setTimeout(()=>DB.set('kv','session',{queue:S.queue,orig:S.orig,qi:S.qi,shuffle:S.shuffle,repeat:S.repeat}),500)}
function recordPlay(t){const p=S.plays[t.id]||{c:0,l:0};p.c++;p.l=Date.now();S.plays[t.id]=p;clearTimeout(recordPlay.t);recordPlay.t=setTimeout(()=>DB.set('kv','plays',S.plays),800)}
function toggleLike(id){if(!id)return;S.likes.has(id)?S.likes.delete(id):S.likes.add(id);DB.set('kv','likes',[...S.likes]);syncLikes();if(S.route.name==='liked')route(true)}

function syncPlay(){const pl=!A.paused&&!!A.getAttribute('src');document.body.classList.toggle('is-playing',pl);kick()}
function syncModes(){$$('[data-act="shuffle"]').forEach(b=>b.classList.toggle('on',S.shuffle));

function updateNP(swap){

  $('#b-t1').textContent=$('#n-t1').textContent=fmt(t?t.dur:0)}
function renderQueue(){
  const el=$('#pane-queue');if(!el)return;if(!S.queue.length){el.innerHTML='<p class="empty">Nothing queued yet. Start a song and the rest of the list shows up here.</p>';return}
  const from=Math.max(0,S.qi-4),to=Math.min(S.queue.length,S.qi+250);
  el.innerHTML=`<div class="q-ctx">${S.shuffle?'Shuffled · ':''}${S.queue.length} in queue${S.ctx?' · '+esc(S.ctx):''}</div>`+S.queue.slice(from,to).map((id,k)=>{const i=from+k,t=S.tracks.get(id);if(!t)return'';
   return`<div class="qrow${i===S.qi?' cur':''}" data-qi="${i}" draggable="true"><div class="cvb">${cov(t.cover)}</div><div class="qm"><div class="qt">${esc(tt(t))}</div><div class="qs">${esc(t.artist||'Unknown artist')}</div></div>

  $('#e-cov').onclick=()=>{const fi=$('#coverin');fi.value='';fi.onchange=()=>{const f=fi.files[0];if(!f)return;pending.cover={blob:f};$('#e-art').innerHTML=`<img class="cv" src="${URL.createObjectURL(f)}" alt="">`};fi.click()};
  $('#e-find').onclick=async()=>{const box=$('#e-cands');box.innerHTML='<p class="sub">Searching…</p>';
    try{const term=[$('#e-artist').value,$('#e-title').value].filter(Boolean).join(' ')||t.name;const j=await web(`https://itunes.apple.com/search?${new URLSearchParams({term,media:'music',entity:'song',limit:6})}`,'itunes');const l=((j&&j.results)||[]).map(mapIt);
      if(!l.length){box.innerHTML='<p class="sub">No matches. Try editing the title or artist first.</p>';return}
      box.innerHTML=l.map((m,i)=>`<button type="button" class="cand" data-ci="${i}"><img src="${esc(m.thumb||'')}" alt=""><span><b>${esc(m.title)}</b><br><small>${esc(m.artist)} · ${esc(m.album)}${m.year?' · '+m.year:''}</small></span></button>`).join('');
      box.onclick=e=>{const b=e.target.closest('.cand');if(!b)return;const m=l[+b.dataset.ci];const set=(k,v)=>{$('#e-'+k).value=v||''};set('title',m.title);set('artist',m.artist);set('album',m.album);set('albumArtist',m.albumArtist&&norm(m.albumArtist)!==norm(m.artist)?m.albumArtist:'');set('year',m.year);set('genre',m.genre);set('no',m.no);set('disc',m.disc);
        pending.cover={url:m.cover};$('#e-art').innerHTML=`<img class="cv" src="${esc(m.thumb||m.cover)}" alt="">`;box.innerHTML=''}}
    catch{box.innerHTML='<p class="sub">Couldn’t reach the lookup service. Check your connection.</p>'}};
  d.showModal()}
function openSettings(){
  const d=$('#dlg-set'),c=S.cfg;
  d.innerHTML=`<h3>Settings</h3>
  <div class="setrow"><div><b>Theme</b><small>Colours always follow the cover art</small></div><div class="seg" style="margin:0" id="set-theme">${['system','light','dark'].map(k=>`<button data-th="${k}" class="${c.theme===k?'on':''}">${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}</div></div>
  <div class="setrow"><div><b>Fill in details from the web</b><small>Artwork, album, year, genre and lyrics via iTunes, MusicBrainz, LRCLIB</small></div><button class="sw" role="switch" id="set-web" aria-checked="${c.web}" aria-label="Fill in details from the web"></button></div>
  <div class="setrow"><div><b>Only fill gaps</b><small>Off means web results can replace tags you already have</small></div><button class="sw" role="switch" id="set-gap" aria-checked="${c.mode==='fill'}" aria-label="Only fill gaps"></button></div>
  <div class="setrow"><div><b>Included songs</b><small id="set-bstat">${esc(bundledNote())}</small></div><button class="sw" role="switch" id="set-bundled" aria-checked="${c.bundled!==false}" aria-label="Included songs"></button></div>
  <div class="setrow"><div><b>Library</b><small>${S.tracks.size.toLocaleString()} songs${S.root?' · folder “'+esc(S.root.name)+'”':''}</small></div><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><button class="btn ton" id="set-rescan">${ic('sync')}Rescan</button><button class="btn ton" id="set-pick">${ic('folder')}Change</button></div></div>
  <div class="setrow"><div><b>Look up everything again</b><small>Runs the web lookup on every song, in the background</small></div><button class="btn ton" id="set-refetch">Start</button></div>
  <div class="setrow"><div><b>Keyboard</b><small>Space play/pause · ←/→ seek · Shift+←/→ previous/next · ↑/↓ volume · M mute · S shuffle · R repeat · L like · / search</small></div></div>
  <div class="dlg-acts"><button class="btn txt" id="set-clear">Forget library</button><button class="btn pri" id="set-done">Done</button></div>`;
  d.showModal();
  $('#set-theme').onclick=e=>{const b=e.target.closest('[data-th]');if(!b)return;S.cfg.theme=b.dataset.th;saveCfg();applyTheme();$$('#set-theme button').forEach(x=>x.classList.toggle('on',x===b))};
  $('#set-web').onclick=e=>{S.cfg.web=!S.cfg.web;e.currentTarget.setAttribute('aria-checked',S.cfg.web);saveCfg();if(S.cfg.web)startEnrich()};
  $('#set-gap').onclick=e=>{S.cfg.mode=S.cfg.mode==='fill'?'all':'fill';e.currentTarget.setAttribute('aria-checked',S.cfg.mode==='fill');saveCfg()};
  $('#set-bundled').onclick=e=>{S.cfg.bundled=S.cfg.bundled===false;e.currentTarget.setAttribute('aria-checked',S.cfg.bundled!==false);saveCfg();
    loadBundled().then(ok=>{route(true);updateNP();const n=$('#set-bstat');if(n)n.textContent=bundledNote();if(ok){probeDurations();startEnrich()}})};
  $('#set-rescan').onclick=()=>{d.close();rescan()};$('#set-pick').onclick=()=>{d.close();pickFolder()};
  $('#set-refetch').onclick=()=>{d.close();S.cfg.mode='all';S.cfg.web=true;saveCfg();for(const t of S.tracks.values())delete t.meta.web;toast('Looking everything up in the background');startEnrich()};
  $('#set-clear').onclick=async()=>{if(!$('#set-clear').dataset.sure){$('#set-clear').dataset.sure=1;$('#set-clear').textContent='Tap again to confirm';return}
    for(const s of['tracks','thumbs','covers','lyrics','kv'])await DB.clear(s);location.reload()};
  $('#set-done').onclick=()=>d.close()}
const saveCfg=()=>DB.set('kv','cfg',S.cfg);

/* ---------- folder picking ---------- */
async function pickFolder(){
  if(window.showDirectoryPicker){try{const h=await showDirectoryPicker({id:'sonora',mode:'read'});await setRoot(h)}catch(e){if(e.name!=='AbortError'){console.warn(e);$('#fin').click()}}}
  else $('#fin').click()}
async function setRoot(h){S.root=h;S.files.clear();await DB.set('kv','root',h);S.needPerm=false;scan({handle:h})}
async function rescan(){if(S.root){try{if((await S.root.queryPermission({mode:'read'}))!=='granted'&&(await S.root.requestPermission({mode:'read'}))!=='granted'){S.needPerm=true;status();return}}catch{}scan({handle:S.root})}else pickFolder()}

/* ---------- events ---------- */
function onAct(act,el,e){
  const id=el.closest('[data-id]')?.dataset.id;
  switch(act){
   case'pick':pickFolder();break;
   case'toggle':togglePlay();break;case'next':next();break;case'prev':prev();break;case'shuffle':toggleShuffle();break;case'repeat':cycleRepeat();break;
   case'mute':S.muted=!S.muted;syncVol();break;
   case'like':toggleLike(id);break;case'like-cur':toggleLike(S.cur&&S.cur.id);break;
   case'menu':trackMenu(id,el);break;
   case'open-np':openNP();break;case'open-queue':openNP('queue');break;case'close-np':closeNP();break;
   case'np-menu':if(S.cur)trackMenu(S.cur.id,el);break;
   case'play-album':{const al=S.albums.get(el.dataset.key);if(al)playList(al.tracks.map(t=>t.id),0,{shuffle:false,ctx:al.name});break}
   case'play-artist':{const ar=S.artists.get(el.dataset.key);if(ar)playList(ar.tracks.map(t=>t.id),0,{shuffle:false,ctx:ar.name});break}
   case'play-list':{const ids=S.lists[el.dataset.list];if(ids)playList(ids,0,{shuffle:false,ctx:ctxName()});break}
   case'shuf-list':{const ids=S.lists[el.dataset.list]||[...S.tracks.values()].map(t=>t.id);if(ids.length)playList(ids,Math.floor(Math.random()*ids.length),{shuffle:true,ctx:ctxName()});break}
   case'genre':S.genre=el.dataset.g;route(true);break;
   case'sort':S.sort[el.dataset.kind]=el.dataset.k;route(true);break;
   case'new-pl':askName('New playlist','').then(async n=>{if(n){const p=await plCreate(n);location.hash='#/playlist/'+enc(p.id)}});break;
   case'pl-menu':{const r=el.getBoundingClientRect(),pid=el.dataset.id;openMenu([{l:'Rename',i:'edit',f:async()=>{const p=S.playlists.find(x=>x.id===pid);const n=await askName('Rename playlist',p.name);if(n){p.name=n;DB.set('playlists',pid,p);route(true)}}},{l:'Delete playlist',i:'trash',f:async()=>{S.playlists=S.playlists.filter(x=>x.id!==pid);await DB.del('playlists',pid);location.hash='#/playlists';toast('Playlist deleted')}}],r.left,r.bottom);break}
   case'q-remove':{const i=+el.dataset.qi;if(i===S.qi)break;const id2=S.queue[i];S.queue.splice(i,1);if(i<S.qi)S.qi--;const oi=S.orig.indexOf(id2);if(oi>=0)S.orig.splice(oi,1);renderQueue();saveSession();break}
   case'enrich':openSettings();break;case'reconnect':rescan();break}}
const ctxName=()=>{const n=S.route.name;return n==='album'?(S.albums.get(S.route.a[0])||{}).name:n==='artist'?(S.artists.get(S.route.a[0])||{}).name:n==='playlist'?(S.playlists.find(p=>p.id===S.route.a[0])||{}).name:n==='liked'?'Liked songs':n==='songs'?'All songs':''};
document.addEventListener('click',e=>{
  const mi=e.target.closest('[data-mi]');if(mi){const it=menuItems[+mi.dataset.mi];closeMenu();it&&it.f&&it.f();return}
  if(!e.target.closest('#menu'))closeMenu();
  const a=e.target.closest('[data-act]');if(a){e.preventDefault();e.stopPropagation();onAct(a.dataset.act,a,e);return}
  const sd=e.target.closest('[data-side]');if(sd){setSide(sd.dataset.side);return}
  const mt=e.target.closest('#np-tabs [data-m]');if(mt){setM(mt.dataset.m);return}
  const lyr=e.target.closest('.ly[data-t]');if(lyr){A.currentTime=+lyr.dataset.t;A.play().catch(()=>{});return}
  const qr=e.target.closest('.qrow');if(qr){load(+qr.dataset.qi,true);return}
  const rw=e.target.closest('.row');if(rw){const list=rw.closest('[data-list]');const ids=list&&S.lists[list.dataset.list];if(ids){const i=ids.indexOf(rw.dataset.id);playList(ids,Math.max(0,i),{ctx:ctxName()})}}});
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select')){if(e.key==='Escape'&&e.target.id==='q'){e.target.value='';e.target.blur();onSearch()}return}
  if(document.querySelector('dialog[open]'))return;
  if((e.key==='Enter'||e.key===' ')&&e.target.closest('.row,.b-left')&&e.target.matches('.row,.b-left')){e.preventDefault();e.target.click();return}
  const k=e.key;
  if(k===' '){e.preventDefault();togglePlay()}else if(k==='ArrowRight'){e.shiftKey?next():A.currentTime+=5}else if(k==='ArrowLeft'){e.shiftKey?prev():A.currentTime-=5}
  else if(k==='ArrowUp'){e.preventDefault();S.vol=Math.min(1,S.vol+.05);S.muted=false;syncVol()}else if(k==='ArrowDown'){e.preventDefault();S.vol=Math.max(0,S.vol-.05);syncVol()}
  else if(k==='m'||k==='M'){S.muted=!S.muted;syncVol()}else if(k==='s'||k==='S')toggleShuffle();else if(k==='r'||k==='R')cycleRepeat();else if(k==='l'||k==='L')toggleLike(S.cur&&S.cur.id);
  else if(k==='/'){e.preventDefault();$('#q').focus()}else if(k==='Escape'){closeMenu();closeNP()}});
document.addEventListener('scroll',closeMenu,true);window.addEventListener('resize',closeMenu);
let dragFrom=-1;
document.addEventListener('dragstart',e=>{const q=e.target.closest&&e.target.closest('.qrow');if(q){dragFrom=+q.dataset.qi;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','q')}});
document.addEventListener('dragover',e=>{e.preventDefault();const q=e.target.closest&&e.target.closest('.qrow');$$('.qrow.dragover').forEach(x=>x.classList.remove('dragover'));if(q&&dragFrom>=0)q.classList.add('dragover')});
document.addEventListener('drop',async e=>{e.preventDefault();$$('.qrow.dragover').forEach(x=>x.classList.remove('dragover'));
  const q=e.target.closest&&e.target.closest('.qrow');
  if(dragFrom>=0){if(q){let to=+q.dataset.qi;if(to!==dragFrom){const cur=S.queue[S.qi],[m]=S.queue.splice(dragFrom,1);S.queue.splice(to,0,m);S.qi=S.queue.indexOf(cur);if(!S.shuffle)S.orig=S.queue.slice();renderQueue();saveSession()}}dragFrom=-1;return}
  const it=[...(e.dataTransfer.items||[])].find(i=>i.kind==='file');if(it&&it.getAsFileSystemHandle){try{const h=await it.getAsFileSystemHandle();if(h&&h.kind==='directory')setRoot(h);else toast('Drop a folder, not a file.')}catch{}}});
document.addEventListener('dragend',()=>{dragFrom=-1});
function onSearch(){const v=$('#q').value;$('#qclear').hidden=!v;const h=v.trim()?'#/search/'+enc(v.trim()):'#/home';
  if(S.route.name==='search'||!v.trim()){history.replaceState(null,'',h);route()}else location.hash=h}
let qT;function bindStatic(){
  $('#q').addEventListener('input',()=>{clearTimeout(qT);qT=setTimeout(onSearch,120)});
  $('#qclear').onclick=()=>{$('#q').value='';onSearch();$('#q').focus()};
  $('#btn-folder').onclick=pickFolder;$('#btn-set').onclick=openSettings;$('#status').onclick=e=>onAct(e.currentTarget.dataset.act||'enrich',e.currentTarget,e);
  $('#vol').addEventListener('input',e=>{S.vol=+e.target.value;S.muted=false;syncVol();DB.set('kv','vol',S.vol)});
  $('#fin').onchange=e=>{const files=[...e.target.files];if(files.length){S.root=null;S.files.clear();DB.del('kv','root');scan({files})}e.target.value=''};
  waves=[new Wave($('#b-wave'),p=>{A.currentTime=p*(A.duration||0);kick()}),new Wave($('#n-wave'),p=>{A.currentTime=p*(A.duration||0);kick()})];
  window.addEventListener('hashchange',()=>route());
  $('#dlg-set').addEventListener('click',e=>{if(e.target.id==='dlg-set')e.target.close()})}

/* ---------- boot ---------- */
async function boot(){
  buildShell();bindStatic();const np=$('#np');np.inert=true;
  try{
    const[tr,th,kv,pl]=await Promise.all([DB.all('tracks'),DB.all('thumbs'),DB.all('kv'),DB.all('playlists')]);
    tr.forEach(([k,v])=>{v.meta=v.meta||{g:{}};v.meta.g=v.meta.g||{};S.tracks.set(k,v)});
    th.forEach(([k,v])=>{if(v.remote)S.thumbs.set(k,{url:v.remote,seed:null,remote:true});else if(v.thumb)S.thumbs.set(k,{url:URL.createObjectURL(v.thumb),seed:v.seed})});
    const K=Object.fromEntries(kv);if(K.cfg)Object.assign(S.cfg,K.cfg);if(K.likes)S.likes=new Set(K.likes);if(K.plays)S.plays=K.plays;if(typeof K.vol==='number')S.vol=K.vol;if(K.root)S.root=K.root;
    S.playlists=pl.map(x=>x[1]).sort((a,b)=>a.created-b.created);rebuild();
    const se=K.session;if(se&&se.queue&&se.queue.length){S.queue=se.queue.filter(id=>S.tracks.has(id));S.orig=(se.orig||S.queue).filter(id=>S.tracks.has(id));S.shuffle=!!se.shuffle;S.repeat=se.repeat||0;S.qi=Math.min(Math.max(0,se.qi||0),S.queue.length-1);S.cur=S.tracks.get(S.queue[S.qi])||null}
  }catch(e){console.warn('load',e)}
  syncVol();applyTheme();if(S.cur)setPalette(S.cur);route();updateNP();status();
  if(S.root){try{const p=await S.root.queryPermission({mode:'read'});if(p==='granted')scan({handle:S.root});else{S.needPerm=true;status()}}catch{}}
  else if(S.tracks.size){S.needPerm=false}
  loadBundled().then(ok=>{route(true);updateNP();status();if(ok){probeDurations();startEnrich()}});
  setTimeout(startEnrich,2000)}
boot();
</script>
